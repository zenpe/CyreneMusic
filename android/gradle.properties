org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
android.useAndroidX=true
# All current release dependencies use AndroidX; legacy Support rewriting is
# unnecessary (verified against the dependency graph and identical release APK).
android.enableJetifier=false
# Cross-drive Kotlin projects are handled individually in build.gradle.kts.
kotlin.incremental=true
