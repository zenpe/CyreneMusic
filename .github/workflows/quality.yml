name: Quality Gate

on:
  workflow_call:
  pull_request:
    branches: [just_audio]
  push:
    branches: [just_audio]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: dart run tool/check_analyzer_baseline.dart

      - name: Check test formatting
        run: dart format --output=none --set-exit-if-changed test

      - name: Test
        run: flutter test

  android-debug:
    needs: analyze-and-test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-music-pr-${{ github.event.pull_request.number }}-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
