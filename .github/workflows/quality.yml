name: Quality Gate

on:
  workflow_call:
    inputs:
      windows-native-in-build:
        description: Run the complete Windows native suite against the packaged DLL in the caller.
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  select-checks:
    name: Select quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          release_tag="v${version%%+*}"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == branch ]] &&
             [[ -n "$(git tag --points-at HEAD --list "$release_tag")" ]]; then
            echo 'Release tag owns quality checks for this commit.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  analyze-and-test:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: dart run tool/check_analyzer_baseline.dart

      - name: Check test formatting
        run: dart format --output=none --set-exit-if-changed test

      - name: Test
        timeout-minutes: 5
        run: flutter test --timeout 60s --reporter expanded

  native-runtime:
    name: Native runtime (${{ matrix.os }})
    needs: select-checks
    if: ${{ needs.select-checks.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows-native-in-build && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build quickjs-ng from pinned source
        run: |
          cmake -S third_party/flutter_js/native -B build/quickjs -DCMAKE_BUILD_TYPE=Release
          cmake --build build/quickjs --config Release --parallel 2

      - name: Test native script execution limits
        timeout-minutes: 3
        env:
          CYRENE_LX_NATIVE_TEST: '1'
          LIBQUICKJSC_TEST_PATH: ${{ github.workspace }}/${{ matrix.os == 'windows-2022' && 'build/quickjs/Release/quickjs_c_bridge.dll' || 'build/quickjs/libquickjs_c_bridge_plugin.so' }}
        run: >-
          flutter test --timeout 30s --reporter expanded
          test/services/lx_execution_limits_native_test.dart
          test/services/lx_quickjs_native_test.dart
          test/services/lx_browser_transport_native_test.dart
          test/services/lx_runtime_worker_test.dart
          test/services/quickjs_ng_bridge_native_test.dart

  android-native:
    name: Android native ABIs
    needs: select-checks
    if: ${{ needs.select-checks.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Ensure pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" ]]; then
            sdkmanager "ndk;$NDK_VERSION"
          fi
      - name: Compile all declared Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"
          echo "Using Android NDK at: $NDK_PATH"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cmake -S third_party/flutter_js/native -B "build/quickjs-$abi" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-21
            cmake --build "build/quickjs-$abi" --parallel 2
          done

  android-debug:
    needs: [analyze-and-test, native-runtime, android-native]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cyrene-music-pr-${{ github.event.pull_request.number }}-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  windows-release:
    needs: [analyze-and-test, native-runtime, android-native]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Verify packaged native engine
        timeout-minutes: 3
        env:
          CYRENE_LX_NATIVE_TEST: '1'
          LIBQUICKJSC_TEST_PATH: ${{ github.workspace }}/build/windows/x64/runner/Release/quickjs_c_bridge.dll
        run: flutter test --timeout 30s --reporter expanded test/services/quickjs_ng_bridge_native_test.dart
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cyrene-music-pr-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: cyrene-music-pr-${{ github.event.pull_request.number }}-windows
          path: cyrene-music-pr-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
