name: Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: false
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows'
        required: false
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux'
        required: false
        type: boolean
        default: false
      build_macos:
        description: '构建 macOS'
        required: false
        type: boolean
        default: false
      build_ios:
        description: '构建 iOS'           
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate build request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate platforms and release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_IOS: ${{ inputs.build_ios }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$BUILD_ANDROID $BUILD_WINDOWS $BUILD_LINUX $BUILD_MACOS $BUILD_IOS" != *true* ]]; then
              echo "::error::Select at least one platform."
              exit 1
            fi
          else
            version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
            expected="v${version%%+*}"
            if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
              echo "::error::Tag must match pubspec.yaml: $expected"
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release commit must belong to main."
              exit 1
            }
          fi

  quality:
    needs: preflight
    uses: ./.github/workflows/quality.yml
  # Android 构建
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CYRENE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYRENE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYRENE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYRENE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing release keystore}"
          : "${STORE_PASSWORD:?Missing keystore password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"
          umask 077
          mkdir -p android/keys
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keys/cyrene-release.jks
          printf '%s\n' "storeFile=keys/cyrene-release.jks" \
            "storePassword=$STORE_PASSWORD" "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk

  # Windows 构建
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows archive
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../cyrene_music-windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: cyrene_music-windows-x64.zip

  # Linux 构建
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libayatana-appindicator3-dev \
            libmpv-dev \
            libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: flutter build linux --release

      - name: Create DEB Package
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d '\r')
          PACKAGE_DIR="cyrene_music_${VERSION}_amd64"
          mkdir -p $PACKAGE_DIR/DEBIAN
          mkdir -p $PACKAGE_DIR/usr/bin
          mkdir -p $PACKAGE_DIR/usr/lib/cyrene_music
          mkdir -p $PACKAGE_DIR/usr/share/applications
          mkdir -p $PACKAGE_DIR/usr/share/icons/hicolor/256x256/apps

          # 复制构建物
          cp -r build/linux/x64/release/bundle/* $PACKAGE_DIR/usr/lib/cyrene_music/
          # 复制图标
          cp assets/icons/tray_icon.png $PACKAGE_DIR/usr/share/icons/hicolor/256x256/apps/cyrene_music.png
          
          # 创建软链接
          ln -s /usr/lib/cyrene_music/cyrene_music $PACKAGE_DIR/usr/bin/cyrene-music

          # 创建 control 文件
          cat <<EOF > $PACKAGE_DIR/DEBIAN/control
          Package: cyrene-music
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, liblzma5, libmpv2 | libmpv1, libasound2
          Maintainer: Moraxs
          Description: A smooth music player built with Flutter.
          EOF

          # 创建 .desktop 文件
          cat <<EOF > $PACKAGE_DIR/usr/share/applications/cyrene-music.desktop
          [Desktop Entry]
          Name=Cyrene Music
          Exec=/usr/bin/cyrene-music
          Icon=cyrene_music
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF

          dpkg-deb --build $PACKAGE_DIR
          mv ${PACKAGE_DIR}.deb cyrene_music-linux-amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          if-no-files-found: error
          retention-days: 14
          path: cyrene_music-linux-amd64.deb

  # macOS 构建
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Cyrene Music" -srcfolder cyrene_music.app -ov -format UDZO cyrene_music-macos.dmg
          mv cyrene_music-macos.dmg ../../../../../

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          retention-days: 14
          path: cyrene_music-macos.dmg

  # iOS 构建
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../cyrene_music-ios-unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          if-no-files-found: error
          retention-days: 14
          path: cyrene_music-ios-unsigned.ipa

  create-release:
    name: Create Release
    needs: [preflight, quality, build-android, build-windows, build-linux, build-macos, build-ios]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify release artifacts and record checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in android-apk/app-release.apk windows-x64/cyrene_music-windows-x64.zip linux-deb/cyrene_music-linux-amd64.deb macos/cyrene_music-macos.dmg ios-unsigned/cyrene_music-ios-unsigned.ipa; do
            test -s "artifacts/$file"
          done
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          printf 'commit=%s\ntag=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > ../build-info.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-x64/*.zip
            artifacts/linux-deb/*.deb
            artifacts/macos/*.dmg
            artifacts/ios-unsigned/*.ipa
            SHA256SUMS.txt
            build-info.txt
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            iOS IPA is unsigned and requires signing before installation.
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

