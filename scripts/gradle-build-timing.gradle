import groovy.json.JsonOutput
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSuccessResult
import org.gradle.tooling.events.task.TaskSkippedResult
import javax.inject.Inject

// A build service receives task completion events without installing task
// actions (which would change task fingerprints and invalidate caches).
abstract class CyreneBuildTiming implements BuildService<CyreneBuildTiming.Parameters>,
        OperationCompletionListener, AutoCloseable {
    interface Parameters extends BuildServiceParameters {
        RegularFileProperty getOutputFile()
    }

    private final List<Map> timings = Collections.synchronizedList(new ArrayList<Map>())

    @Override
    void onFinish(FinishEvent event) {
        if (!(event instanceof TaskFinishEvent)) return
        def result = event.result
        def outcome = 'failed'
        if (result instanceof TaskSuccessResult) {
            outcome = result.fromCache ? 'from-cache' : (result.upToDate ? 'up-to-date' : 'executed')
        } else if (result instanceof TaskSkippedResult) {
            outcome = 'skipped'
        }
        timings.add([
            task: event.descriptor.taskPath,
            durationMs: result.endTime - result.startTime,
            outcome: outcome,
        ])
    }

    @Override
    void close() {
        def output = parameters.outputFile.get().asFile
        output.parentFile.mkdirs()
        def snapshot = new ArrayList<Map>(timings)
        snapshot.sort { a, b -> b.durationMs <=> a.durationMs }
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            // Tasks can overlap: their durations must not be summed as wall time.
            tasks: snapshot,
        ])), 'UTF-8')
    }
}

abstract class CyreneTimingServices {
    @Inject abstract BuildEventsListenerRegistry getRegistry()
}

def timingService = gradle.sharedServices.registerIfAbsent('cyreneBuildTiming', CyreneBuildTiming) {
    parameters.outputFile.set(file(providers.gradleProperty('cyreneBuildTimingFile').get()))
}
objects.newInstance(CyreneTimingServices).registry.onTaskCompletion(timingService)
